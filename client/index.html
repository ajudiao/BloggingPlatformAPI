<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testar Blog API</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
      }
      form {
        display: flex;
        background-color: gray;
        flex-direction: column;
        padding: 10px;
        gap: 1rem;
        width: 300px;
      }
      #message {
        width: 300px;
        margin-top: 1rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <form id="form">
      <input type="text" placeholder="Titulo" id="title" required />
      <textarea id="content" placeholder="Conteudo" required></textarea>
      <select name="category" id="category">
        <option value="front-end">FrontEnd</option>
        <option value="backend">BackEnd</option>
        <option value="fullstack">FullStack</option>
      </select>
      <input type="text" id="tags" placeholder="javascript, api" required />

      <button type="submit">Postar</button>

      <a href="posts.html" style="margin-top: 18px;">Posts</a>
    </form>
    <pre id="message"></pre>

    <script>
      const form = document.getElementById("form");
      const message = document.getElementById("message");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        message.textContent = "Enviando...";

        const body = {
          title: document.getElementById("title").value,
          content: document.getElementById("content").value,
          category: document.getElementById("category").value,
          tags: document
            .getElementById("tags")
            .value.split(",")
            .map((tag) => tag.trim())
            .filter(Boolean),
        };

        try {
          const result = await fetch("http://localhost:3000/posts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await result.json();

          if (!result.ok) {
            throw new Error(data.message || "Erro ao criar post");
          }

          message.textContent = `Post criado com sucesso:\n${JSON.stringify(data, null, 2)}`;
          form.reset();
        } catch (error) {
          message.textContent = `Erro: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
